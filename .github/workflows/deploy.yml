name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      # Optional art site (docs/part-ii/09-hosting-arte.md). Repository variables NOLC_ART_BASE /
      # NOLC_ART_BASE_FULL; both unset (the default) = every SVG ships with the game, exactly as before.
      - name: Guard — art site published and identical (only when an art base is set)
        if: ${{ vars.NOLC_ART_BASE != '' || vars.NOLC_ART_BASE_FULL != '' }}
        env:
          VITE_ART_BASE: ${{ vars.NOLC_ART_BASE }}
          VITE_ART_BASE_FULL: ${{ vars.NOLC_ART_BASE_FULL }}
        run: node scripts/art-publish.ts check --src public
      - run: npm run build
        env:
          VITE_ART_BASE: ${{ vars.NOLC_ART_BASE }}
          VITE_ART_BASE_FULL: ${{ vars.NOLC_ART_BASE_FULL }}
      - name: Site size (GitHub Pages limit is 1 GB)
        run: du -sh dist
      - name: Guard — no raster images in the build
        run: |
          if find dist -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | grep -q .; then
            echo "Raster image found in dist/"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
